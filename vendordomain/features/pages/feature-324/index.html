<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Workspace Fitur — VendorDomain</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#17233b;--accent:#5ce1e6;--soft:#b4c7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,var(--panel),var(--bg) 60%);color:#f4f7ff;font:15px/1.6 system-ui,sans-serif}header{padding:22px clamp(16px,4vw,56px);border-bottom:1px solid #ffffff20;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--accent)}a{color:var(--accent)}main{max-width:1120px;margin:auto;padding:clamp(18px,4vw,48px)}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.13em;text-transform:uppercase;font-size:.75rem}.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,.7fr);gap:20px}.panel{background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid #ffffff24;border-radius:var(--radius,18px);padding:clamp(18px,3vw,30px);box-shadow:0 18px 60px #0002}h1{font-size:clamp(2rem,5vw,4.2rem);line-height:1.05;letter-spacing:-.04em;margin:.4em 0}h2{font-size:1.1rem;margin-top:0}.meta{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #ffffff35;border-radius:99px;padding:4px 10px;font-size:.78rem;color:var(--soft)}.number{font-size:clamp(3rem,7vw,5.5rem);line-height:1;font-weight:900;color:var(--accent)}label{display:block;font-weight:700;margin:14px 0 5px}input,textarea,select{width:100%;padding:12px 13px;background:#080e1a99;border:1px solid #ffffff38;border-radius:10px;color:white;font:inherit}button{border:0;border-radius:10px;background:var(--accent);color:#101321;font-weight:800;padding:12px 17px;margin-top:16px;cursor:pointer}.output{margin-top:18px;padding:15px;border-radius:12px;background:#05091188;border:1px dashed #ffffff40;min-height:62px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.small{font-size:.88rem;color:#c4cede}footer{max-width:1120px;margin:auto;padding:24px;color:#b4c0d4;font-size:.85rem}@media(max-width:720px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:no-preference){.panel{animation:rise .35s ease-out}@keyframes rise{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body><header><div class="brand">✦ <span>VENDOR</span>DOMAIN / WORKSPACE</div><nav><a href="../../index.html">Katalog 500 fitur</a> · <a href="../../../index.html">Beranda VendorDomain</a></nav></header><main id="app"><p>Memuat workspace fitur…</p></main><footer>VendorDomain · Workspace fitur individual. Demo browser lokal; tidak mengubah registrar, DNS, pembayaran, autentikasi, atau layanan eksternal.</footer>
<script>
(async()=>{
const palettes=[['#0b1020','#17233b','#5ce1e6','#b4c7ff'],['#17110b','#2d2118','#f6b75b','#ffe2b2'],['#0d1b16','#18362a','#75e0a4','#b8f4d1'],['#1a1022','#30203e','#d2a5ff','#f0dcff'],['#101a22','#1b303c','#79c8ff','#c9edff'],['#211015','#3a1d28','#ff8ca8','#ffd5df']];
const hints={1:['Panel ringkasan','Periksa status dan susun pintasan kerja','Buat catatan lokal'],2:['Konsol domain','Validasi nama domain dan siapkan catatan permintaan','Validasi domain'],3:['Konsol vendor','Siapkan data vendor dan catatan tindak lanjut','Validasi data vendor'],4:['Katalog ekstensi','Cari ekstensi dan buat daftar pilihan lokal','Cari ekstensi'],5:['Laboratorium DNS','Susun contoh record DNS dan validasi format','Validasi record DNS'],6:['Penerbit konten','Tulis konten dan lihat pratinjau halaman','Pratinjau konten'],7:['Panel infrastruktur','Catat konfigurasi dan cek kelengkapan','Periksa konfigurasi'],8:['Manajer ekstensi','Susun daftar ekstensi dan status lokal','Perbarui daftar'],9:['Pemeriksa rute','Validasi jalur URL dan tampilkan rute contoh','Uji rute'],10:['Pemeriksa keamanan','Jalankan checklist keamanan lokal','Jalankan checklist'],11:['Konsol API','Validasi payload JSON dan simulasikan permintaan','Validasi JSON'],12:['Ruang otomasi','Buat langkah otomasi lokal dan pratinjau hasil','Jalankan simulasi'],13:['Manajer berkas','Catat berkas dan validasi metadata lokal','Validasi metadata'],14:['Studio konten','Tulis dan pratinjau konten lokal','Pratinjau konten'],15:['Pemeriksa SEO','Periksa judul, deskripsi, dan panjang metadata','Analisis metadata'],16:['Panel analitik','Catat metrik contoh dan rangkum hasil','Hitung ringkasan'],17:['Konsol akses','Validasi isian akses tanpa menyimpan kredensial','Validasi isian'],18:['Kalkulator transaksi','Hitung estimasi transaksi lokal','Hitung estimasi'],19:['Checklist kepatuhan','Tandai kontrol dan rangkum status lokal','Evaluasi checklist'],20:['Workbench pengembang','Validasi konfigurasi dan buat laporan lokal','Validasi konfigurasi']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const path=location.pathname.match(/feature-(\d{3})/),id=Number(path?.[1]||new URLSearchParams(location.search).get('id'));
try{
const r=await fetch('../../index.json');if(!r.ok)throw Error('index.json tidak dapat dimuat');const d=await r.json(),f=d.features.find(x=>x.id===id);if(!f)throw Error('ID fitur tidak valid');const p=palettes[(id-1)%palettes.length],h=hints[f.moduleNumber]||['Workbench fitur','Jalankan pemeriksaan lokal dan catat hasil','Jalankan demo'];document.documentElement.style.setProperty('--bg',p[0]);document.documentElement.style.setProperty('--panel',p[1]);document.documentElement.style.setProperty('--accent',p[2]);document.documentElement.style.setProperty('--soft',p[3]);document.documentElement.style.setProperty('--radius',id%2?'22px':'8px');document.title=f.name+' — VendorDomain';
let labels=f.moduleNumber===5?['Nama record','Nilai record']:f.moduleNumber===11?['Payload JSON','Catatan permintaan']:f.moduleNumber===15?['Judul halaman','Deskripsi halaman']:f.moduleNumber===18?['Nilai dasar','Biaya (%)']:[6,14].includes(f.moduleNumber)?['Judul konten','Isi konten']:['Masukan utama','Catatan'];
const multi=[6,11,14].includes(f.moduleNumber),num=f.moduleNumber===18;
document.querySelector('#app').innerHTML='<div class="eyebrow">FITUR '+esc(f.code)+' · MODUL '+String(f.moduleNumber).padStart(2,'0')+'</div><div class="hero"><section class="panel"><div class="meta"><span class="chip">'+esc(f.module)+'</span><span class="chip">'+esc(f.category)+'</span><span class="chip">Demo lokal</span></div><h1>'+esc(f.name)+'</h1><p>'+esc(f.description)+'</p><p class="small">'+esc(f.function)+'</p><div class="grid"><div><div class="small">Nomor fitur</div><strong>'+f.code+'/500</strong></div><div><div class="small">Posisi modul</div><strong>'+f.position+'/25</strong></div><div><div class="small">Produksi</div><strong>Belum aktif</strong></div></div></section><aside class="panel"><div class="number">'+esc(f.code)+'</div><h2>'+esc(h[0])+'</h2><p>'+esc(h[1])+'</p><p class="small">Halaman individual dengan tampilan tematik, warna, dan aksi yang dipilih berdasarkan ID/modul.</p></aside></div><section class="panel" style="margin-top:18px"><h2>Ruang kerja: '+esc(f.name)+'</h2><p>'+esc(h[1])+'</p><form id="demoForm"><label for="a">'+esc(labels[0])+'</label><input id="a" '+(num?'type="number" min="0" step="0.01" value="100000"':'type="text"')+' placeholder="'+esc(labels[0])+'" autocomplete="off"><label for="b">'+esc(labels[1])+'</label>'+(multi?'<textarea id="b" rows="4" placeholder="'+esc(labels[1])+'"></textarea>':'<input id="b" '+(num?'type="number" min="0" step="0.01" value="0"':'type="text"')+' placeholder="'+esc(labels[1])+'">')+'<button type="submit">'+esc(h[2])+' ↗</button></form><div class="output" id="out" role="status" aria-live="polite">Hasil demo akan tampil di sini.</div></section><div class="grid"><article class="panel"><h2>Data fitur</h2><p class="small">'+esc(f.module)+' · '+esc(f.category)+' · ID '+f.id+'</p><p>Data diambil dari indeks pusat 500 fitur.</p></article><article class="panel"><h2>Jejak lokal</h2><p class="small" id="trace">Belum ada aksi.</p><button id="traceButton" type="button">Catat aksi lokal</button></article><article class="panel"><h2>Persyaratan produksi</h2><p class="small">'+esc(f.productionRequirements)+'</p></article></div>';
const out=document.querySelector('#out'),trace=document.querySelector('#trace');document.querySelector('#demoForm').addEventListener('submit',e=>{e.preventDefault();const a=document.querySelector('#a').value,b=document.querySelector('#b').value;
if(f.moduleNumber===11){try{const v=JSON.parse(a);out.textContent='JSON valid ('+(Array.isArray(v)?'array':typeof v)+'). Simulasi lokal; endpoint tidak dipanggil.'}catch(err){out.textContent='JSON tidak valid: '+err.message;return}}
else if(f.moduleNumber===5){if(!/^[a-zA-Z0-9_-]+$/.test(a.trim())){out.textContent='Nama record hanya boleh huruf, angka, _ atau -.';return}if(!b.trim()){out.textContent='Isi nilai record.';return}out.textContent='Record contoh tersusun: '+a+' → '+b+'. Belum diterapkan ke nameserver.'}
else if(f.moduleNumber===15){if(!a.trim()){out.textContent='Isi judul halaman.';return}out.textContent='Judul '+a.length+' karakter; deskripsi '+b.length+' karakter. '+(a.length<=60?'Panjang judul cukup ringkas.':'Pertimbangkan judul lebih pendek.')}
else if(f.moduleNumber===18){const amount=Number(a),rate=Number(b);if(!Number.isFinite(amount)||!Number.isFinite(rate)||amount<0||rate<0){out.textContent='Masukkan angka nol atau lebih.';return}out.textContent='Estimasi biaya '+(amount*rate/100).toLocaleString('id-ID')+'; total perkiraan '+(amount+amount*rate/100).toLocaleString('id-ID')+'. Bukan tagihan.'}
else if(f.moduleNumber===19){out.textContent='Checklist lokal selesai. Catatan: '+(a.trim()||'belum ada')+'. Verifikasi formal masih memerlukan bukti dan pemeriksaan manusia.'}
else if([6,14].includes(f.moduleNumber)){out.innerHTML='<strong>'+esc(a||'Tanpa judul')+'</strong><p>'+esc(b).replace(/\n/g,'<br>')+'</p><small>Pratinjau lokal, belum dipublikasikan.</small>'}
else if(f.moduleNumber===16){out.textContent='Ringkasan lokal: '+(a+' '+b).trim().split(/\s+/).filter(Boolean).length+' kata masukan; '+a.length+' karakter pada kolom pertama.'}
else if(f.moduleNumber===10){out.innerHTML='✓ Masukan diperiksa<br>✓ Tidak ada rahasia dikirim<br>✓ Operasi eksternal tidak dijalankan<br><small>Demo ini bukan audit keamanan menyeluruh.</small>'}
else if(f.moduleNumber===17){out.textContent=a.trim()?'Isian siap untuk validasi demo; tidak ada akun dibuat atau data dikirim.':'Masukkan identitas/peran contoh. Jangan masukkan kata sandi atau token.'}
else if(f.moduleNumber===9){out.textContent=a.startsWith('/')?'Rute contoh valid secara bentuk: '+a+'. Tidak ada server yang dihubungi.':'Gunakan jalur relatif yang dimulai dengan /.'}
else{out.textContent=(a.trim()||b.trim())?'Fungsi '+f.name+' selesai dalam demo lokal. Hasil dicatat pada panel ini; layanan eksternal tidak diubah.':'Isi setidaknya satu kolom sebelum menjalankan fungsi.'}
trace.textContent='Aksi fitur '+f.code+' dijalankan pada sesi browser ini.'});
document.querySelector('#traceButton').addEventListener('click',()=>trace.textContent='Catatan lokal: '+f.name+' · '+new Date().toLocaleString('id-ID')+'. Tidak disimpan ke server.');
}catch(e){document.querySelector('#app').textContent='Gagal memuat fitur: '+e.message}
})();</script></body></html>
