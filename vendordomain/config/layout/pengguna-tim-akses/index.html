<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konfigurasi Pengguna, Tim dan Akses</title><style>
:root{color-scheme:dark;--bg:#050a14;--p:#0d1c30;--line:#29415d;--text:#eaf4ff;--muted:#9cb2cc;--a:#73cfff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#17395a,transparent 42%),#050a14;color:var(--text);font:14px/1.55 system-ui}header{padding:20px 4%;background:#071222;border-bottom:1px solid var(--line)}main{padding:20px;max-width:1450px;margin:auto}h1{margin:6px 0;font-size:clamp(24px,4vw,38px)}a{color:#83dfff;text-decoration:none}.shell{display:grid;grid-template-columns:280px 1fr;gap:14px}.panel{background:linear-gradient(145deg,#0d1c30,#081423);border:1px solid var(--line);padding:16px}.list{display:grid;gap:5px;max-height:70vh;overflow:auto}.list button,.tabs button,.actions button{background:#10243a;color:var(--text);border:1px solid var(--line);padding:10px;cursor:pointer}.list button{text-align:left}.active{border-color:var(--a)!important;color:var(--a)!important}.tabs,.actions,.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--line);padding:7px;background:#081526}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px}.field label,.muted{color:var(--muted)}input,select{width:100%;padding:10px;background:#071321;border:1px solid var(--line);color:var(--text)}.preview{border:1px dashed #42627f;padding:16px;min-height:120px}.status{color:#68dfa2;min-height:24px}@media(max-width:800px){.shell{grid-template-columns:1fr}.list{max-height:240px;grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style><header><div class="muted">VENDORDOMAIN / MODUL 17 / KONFIGURASI BERLAPIS</div><h1>Pengguna, tim dan akses</h1><p class="muted">25 menu · 6 lapisan konfigurasi · profil terpisah per menu</p><a href="../../index.html">← Kembali ke VendorDomain</a></header><main><div class="shell"><aside class="panel"><h2>Daftar menu</h2><input id="search" placeholder="Cari menu"><div id="list" class="list"></div></aside><section class="panel"><div class="muted" id="crumb">Pilih menu</div><h2 id="name">Konfigurasi per menu</h2><div class="tabs"><button data-tab="layout" class="active">LAYOUT</button><button data-tab="choices">PILIHAN</button><button data-tab="application">PENERAPAN</button><button data-tab="storage">PENYIMPANAN</button><button data-tab="system">FOLDER FILE</button><button data-tab="configuration">KONFIGURASI</button></div><div id="content"></div><div class="actions"><button id="preview">Pratinjau</button><button id="apply">Terapkan</button><button id="save">Simpan</button><button id="export">Ekspor JSON</button><button id="importBtn">Impor JSON</button><input id="import" type="file" accept="application/json" hidden></div><div id="status" class="status"></div><h3>Pratinjau</h3><div id="previewBox" class="preview">Pilih menu.</div></section></div></main><script>
const $=s=>document.querySelector(s),key=id=>"pb-vd-users-access-"+id;let data,active,tab="layout";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function list(q=""){$("#list").innerHTML="";data.items.filter(x=>(x.id+" "+x.name).toLowerCase().includes(q.toLowerCase())).forEach(x=>{let b=document.createElement("button");b.textContent=x.id+" · "+x.name;b.className=active?.id===x.id?"active":"";b.onclick=()=>choose(x.id);$("#list").append(b)})}
function choose(id){active=JSON.parse(JSON.stringify(data.items.find(x=>x.id===id)));try{active=JSON.parse(localStorage.getItem(key(id)))||active}catch{}$("#name").textContent=active.name;$("#crumb").textContent="MENU "+id+" / 25";list($("#search").value);render()}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let c="";
if(tab==="layout")c='<div class="grid"><div class="field"><label>Jenis layout</label><input id="type" value="'+esc(active.layout.type)+'"></div><div class="field"><label>Kepadatan</label><select id="density"><option>rapat</option><option>normal</option><option>lega</option></select></div><div class="field"><label>Kolom</label><input id="columns" type="number" min="1" max="4" value="'+active.layout.columns+'"></div><div class="field"><label>Navigasi</label><select id="navigation"><option>sidebar</option><option>tabs</option><option>split-panel</option><option>toolbar</option></select></div></div>';
if(tab==="choices")c='<h3>Pilihan komponen</h3><div class="chips">'+active.choices.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div><p class="muted">Opsi tampilan khusus untuk '+esc(active.name)+'.</p>';
if(tab==="application")c='<div class="grid"><div class="field"><label>Mode penerapan</label><select id="mode"><option>bertahap</option><option>langsung</option><option>terjadwal</option><option>dengan-persetujuan</option></select></div><div class="field"><label>Validasi</label><select id="validation"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></div><div class="field"><label>Rollback</label><select id="rollback"><option value="true">Diizinkan</option><option value="false">Nonaktif</option></select></div></div><p class="muted">Penerapan profil tampilan lokal; tindakan autentikasi produksi tetap memerlukan backend aman.</p>';
if(tab==="storage")c='<p class="muted">Akar: '+esc(active.storage.root)+'</p><div class="chips">'+active.storage.files.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div>';
if(tab==="system")c='<h3>Struktur folder</h3><p class="muted">'+esc(active.storage.root)+'/</p>'+active.folders.map((x,i)=>'<p class="chip">'+esc(x)+' → '+esc(active.storage.files[i]||"events.json")+'</p>').join("")+'<p class="muted">Peta folder/file per menu. GitHub Pages tidak dapat menulis langsung ke repositori.</p>';
if(tab==="configuration")c='<div class="field"><label>Profil konfigurasi</label><input id="profile" value="'+esc(active.configuration.profile)+'"></div><p class="muted">Akses pengelola: '+esc(active.configuration.access.join(", "))+' · Audit: aktif · Versi: 1</p>';
$("#content").innerHTML=c;if($("#density"))$("#density").value=active.layout.density;if($("#navigation"))$("#navigation").value=active.layout.navigation;if($("#mode"))$("#mode").value=active.application.mode;if($("#validation"))$("#validation").value=String(active.application.validation);if($("#rollback"))$("#rollback").value=String(active.application.rollback)}
function sync(){if($("#type"))active.layout.type=$("#type").value;if($("#density"))active.layout.density=$("#density").value;if($("#columns"))active.layout.columns=+$("#columns").value;if($("#navigation"))active.layout.navigation=$("#navigation").value;if($("#mode"))active.application.mode=$("#mode").value;if($("#validation"))active.application.validation=$("#validation").value==="true";if($("#rollback"))active.application.rollback=$("#rollback").value==="true";if($("#profile"))active.configuration.profile=$("#profile").value}
function msg(s){$("#status").textContent=s}
document.querySelector(".tabs").onclick=e=>{let b=e.target.closest("[data-tab]");if(!b)return;sync();tab=b.dataset.tab;render()};$("#search").oninput=()=>list($("#search").value);
$("#preview").onclick=()=>{sync();$("#previewBox").innerHTML="<b>"+esc(active.name)+"</b><p>"+esc(active.layout.type)+" · "+active.layout.columns+" kolom · "+esc(active.layout.navigation)+"</p>"+active.choices.map(x=>'<span class="chip">'+esc(x)+'</span>').join(" ");msg("Pratinjau diperbarui.")};
$("#apply").onclick=()=>{sync();active.application.state="applied";active.application.appliedAt=new Date().toISOString();localStorage.setItem(key(active.id),JSON.stringify(active));msg("Profil diterapkan pada browser ini.")};
$("#save").onclick=()=>{sync();localStorage.setItem(key(active.id),JSON.stringify(active));msg("Konfigurasi "+active.id+" disimpan secara lokal.")};
$("#export").onclick=()=>{sync();let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(active,null,2)],{type:"application/json"}));a.href=u;a.download="pengguna-tim-akses-"+active.id+".json";a.click();URL.revokeObjectURL(u);msg("JSON diekspor.")};
$("#importBtn").onclick=()=>$("#import").click();$("#import").onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let v=JSON.parse(await f.text());if(!v.id||!v.layout||!v.configuration)throw Error("Profil tidak valid");active=v;localStorage.setItem(key(v.id),JSON.stringify(v));render();msg("Profil diimpor.")}catch(x){msg("Impor gagal: "+x.message)}e.target.value=""};
fetch("./pengguna-tim-akses.json").then(r=>r.json()).then(v=>{data=v;list();choose(new URLSearchParams(location.search).get("menu")||"401")}).catch(e=>msg("Manifest gagal dimuat: "+e.message));
</script></main></body></html>
