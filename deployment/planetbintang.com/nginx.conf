# Template only for a separately managed VPS; GitHub Pages does not run Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name planetbintang.com www.planetbintang.com;
    root /var/www/planetbintang.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# Add a separate 443 server block and HTTP→HTTPS redirect only after TLS is issued.
# Never paste private keys into Git. For HTTPS, use an ACME client such as Certbot.
