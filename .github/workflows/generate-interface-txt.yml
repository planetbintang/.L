name: Generate OS MEDIA VM TXT interface files

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/buat-berkas-antarmuka-txt.py"
      - "osmediavm/pusat_registri/daftar-menu.json"
      - ".github/workflows/generate-interface-txt.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate 1,500 menu TXT files, 25,000 definitions, and 150 infrastructure TXT specifications
        run: python3 tools/buat-berkas-antarmuka-txt.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osmediavm/pusat_registri/berkas-txt/ osmediavm/infrastruktur-150/ osmediavm/infrastruktur-1500/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan berkas TXT."
          else
            git commit -m "Generate 1500 berkas TXT antarmuka OS MEDIA VM"
            git push
          fi
