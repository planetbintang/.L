name: Deploy Planetbintang REIC to GitHub Pages
# REIC is the canonical source format; HTML is generated only in the Pages artifact.
on:
  push:
    branches:
      - io
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Queue deployments instead of cancelling an in-progress publish when pushes arrive close together.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Planetbintang REIC system
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build REIC sources into browser-renderable Pages output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path('.').resolve()
          manifest = root / 'scripts/html-reic-migration-manifest.txt'
          if not manifest.is_file():
              raise SystemExit('FAIL: scripts/html-reic-migration-manifest.txt is missing')

          restored = 0
          missing = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              rel = raw.strip()
              if not rel or rel.startswith('#'):
                  continue
              source = (root / rel).resolve()
              if root not in source.parents or source.suffix.lower() != '.reic':
                  raise SystemExit(f'FAIL: invalid REIC source path: {rel}')
              if not source.is_file():
                  missing.append(rel)
                  continue
              target = source.with_suffix('.html')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source.read_bytes())
              restored += 1

          if missing:
              print('Missing REIC source files:')
              print('\n'.join(f' - {p}' for p in missing[:100]))
              raise SystemExit(f'FAIL: {len(missing)} manifest source(s) missing')
          for required in ('index.html', 'osmediavm/index.html', 'osmediavm/recordin/index.html'):
              if not (root / required).is_file():
                  raise SystemExit(f'FAIL: Pages entrypoint not generated: {required}')
          print(f'REIC build complete: generated {restored} HTML pages for GitHub Pages.')
          print('Canonical source files remain .reic; generated HTML is only a deployment artifact.')
          PY

      - name: Validate all VendorDomain menu routes and 500 feature pages
        run: python3 scripts/validate-vendordomain-pages.py

      - name: Build REIC library modules
        run: python3 scripts/bangun-perpustakaan.py

      - name: Validate generated production pages and feature registry
        run: python3 scripts/validate-production-surface.py

      - name: Keep static files and REIC sources in the Pages artifact
        run: |
          touch .nojekyll
          test -f index.reic
          test -f index.html
          test -f osmediavm/index.reic
          test -f osmediavm/index.html
          test -f osmediavm/recordin/index.reic
          test -f osmediavm/recordin/index.html

      - name: Upload Planetbintang system as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
