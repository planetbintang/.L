name: Deploy Planetbintang REIC to GitHub Pages

on:
  push:
    branches:
      - io
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Planetbintang source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build and verify browser pages from canonical REIC files
        run: python3 scripts/build-reic-pages.py

      - name: Validate root REIC and Pages markers
        run: |
          test -f index.reic
          test -f index.html
          test -f .nojekyll

      - name: Upload complete static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
