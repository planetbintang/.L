name: Deploy Planetbintang REIC to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Planetbintang source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js for GALERI dashboard build
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Build GALERI dashboard for its GitHub Pages subpath
        working-directory: galeri/dashboard
        env:
          MANUS_PROJECT_ID: ${{ secrets.GALERI_MANUS_PROJECT_ID }}
          MANUS_OAUTH_PORTAL_URL: ${{ secrets.GALERI_MANUS_OAUTH_PORTAL_URL }}
          MANUS_API_URL: ${{ secrets.GALERI_API_URL }}
          MANUS_API_BROWSER_KEY: ${{ secrets.GALERI_API_BROWSER_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build:static
          cp -a dist/public/. .
          test -s index.html
          test -s api/platform/config.js

      - name: Build and verify browser pages from canonical REIC files
        run: python3 scripts/build-reic-pages.py

      - name: Build privacy-minimal snapshot freshness status
        run: python3 scripts/build-public-monitor-status.py

      - name: Validate live monitor and required static route outputs
        run: python3 scripts/validate-live-monitor.py --require-output

      - name: Validate production feature catalog and GitHub Operations
        run: python3 scripts/validate-production-surface.py

      - name: Set up Node.js for VendorDomain validation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate VendorDomain feature routes and layer bundles
        run: node vendordomain/features/verify-feature-system.mjs --require-html

      - name: Validate root REIC and Pages markers
        run: |
          test -f index.reic
          test -f index.html
          test -f .nojekyll

      - name: Upload complete static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
          error_count: 50
          reporting_interval: 15000
