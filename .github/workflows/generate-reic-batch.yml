name: Generate initial REIC batches (51k + 100k)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-in-order:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: io
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate first batch — 51,000 files
        run: node scripts/generate-reic-batch.mjs --start 0 --count 51000
      - name: Generate second batch — 100,000 files
        run: node scripts/generate-reic-batch.mjs --start 51000 --count 100000
      - name: Verify all 151,000 files
        run: node scripts/verify-reic-batch.mjs --dir osmediavm/recordin/generated --expected 151000 --start 0
      - name: Upload verified REIC batches
        uses: actions/upload-artifact@v4
        with:
          name: planetbintang-reic-initial-151000
          path: osmediavm/recordin/generated/
          if-no-files-found: error
          retention-days: 30
