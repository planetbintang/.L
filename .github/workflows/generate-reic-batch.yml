name: Generate complete REIC system (1.5 million files)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-in-order:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: io
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate first batch — 51,000 files
        run: node scripts/generate-reic-batch.mjs --start 0 --count 51000
      - name: Generate second batch — 100,000 files
        run: node scripts/generate-reic-batch.mjs --start 51000 --count 100000
      - name: Generate continuation 1/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 151000 --count 50510
      - name: Generate continuation 2/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 201510 --count 50510
      - name: Generate continuation 3/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 252020 --count 50510
      - name: Generate continuation 4/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 302530 --count 50510
      - name: Generate continuation 5/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 353040 --count 50510
      - name: Generate continuation 6/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 403550 --count 50510
      - name: Generate continuation 7/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 454060 --count 50510
      - name: Generate continuation 8/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 504570 --count 50510
      - name: Generate continuation 9/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 555080 --count 50510
      - name: Generate continuation 10/10 — 50,510 files
        run: node scripts/generate-reic-batch.mjs --start 605590 --count 50510
      - name: Generate continuation 1/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 656100 --count 50000
      - name: Generate continuation 2/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 706100 --count 50000
      - name: Generate continuation 3/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 756100 --count 50000
      - name: Generate continuation 4/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 806100 --count 50000
      - name: Generate continuation 5/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 856100 --count 50000
      - name: Generate continuation 6/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 906100 --count 50000
      - name: Generate continuation 7/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 956100 --count 50000
      - name: Generate continuation 8/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1006100 --count 50000
      - name: Generate continuation 9/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1056100 --count 50000
      - name: Generate continuation 10/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1106100 --count 50000
      - name: Generate continuation 11/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1156100 --count 50000
      - name: Generate continuation 12/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1206100 --count 50000
      - name: Generate continuation 13/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1256100 --count 50000
      - name: Generate continuation 14/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1306100 --count 50000
      - name: Generate continuation 15/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1356100 --count 50000
      - name: Generate continuation 16/17 — 50,000 files
        run: node scripts/generate-reic-batch.mjs --start 1406100 --count 50000
      - name: Generate continuation 17/17 — 43,900 files
        run: node scripts/generate-reic-batch.mjs --start 1456100 --count 43900
      - name: Verify all 1,500,000 files
        run: node scripts/verify-reic-batch.mjs --dir osmediavm/recordin/generated --expected 1500000 --start 0
      - name: Commit all physical REIC files to branch io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osmediavm/recordin/generated/
          git commit -m "Generate and verify 1,500,000 physical REIC files"
          git push origin HEAD:io
