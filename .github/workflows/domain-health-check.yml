name: GitHub Pages Automatic Health Check

on:
  workflow_dispatch:
  push:
    branches:
      - io
    paths:
      - ".github/workflows/domain-health-check.yml"
      - ".github/workflows/deploy-pages.yml"
      - "vmdesktopreic/**"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pages-health-check
  cancel-in-progress: true

jobs:
  check-pages:
    name: Verify published GitHub Pages endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check homepage and VMDESKTOPREIC
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://planetbintang.github.io/.L/"
            "https://planetbintang.github.io/.L/vmdesktopreic/"
          )

          failed=0
          for url in "${urls[@]}"; do
            echo "::group::Checking ${url}"
            code="$(curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 60 \
              --output /tmp/pages-check.html \
              --write-out '%{http_code}' "${url}" || true)"

            if [[ ! "${code}" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Expected HTTP 2xx for ${url}; received ${code:-no response}."
              failed=1
            elif [[ ! -s /tmp/pages-check.html ]]; then
              echo "::error::Empty response body for ${url}."
              failed=1
            else
              echo "PASS: ${url} returned HTTP ${code} with a non-empty body."
            fi
            echo "::endgroup::"
          done

          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::GitHub Pages automatic health check failed."
            exit 1
          fi

          echo "PASS: homepage and VMDESKTOPREIC are reachable."
