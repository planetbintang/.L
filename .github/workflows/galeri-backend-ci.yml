name: GALERI Backend CI

on:
  push:
    branches: [io]
    paths:
      - "galeri-server/**"
      - ".github/workflows/galeri-backend-ci.yml"
  pull_request:
    branches: [io]
    paths:
      - "galeri-server/**"
      - ".github/workflows/galeri-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galeri-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: galeri-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Run tests
        run: npm test
