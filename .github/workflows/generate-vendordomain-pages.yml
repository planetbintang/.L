name: Generate vendordomain feature pages
on:
  push:
    branches: [io]
    paths:
      - "vendordomain/vendor.js"
      - "scripts/generate-vendordomain-pages.mjs"
      - ".github/workflows/generate-vendordomain-pages.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: io
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate 500 standalone pages
        run: node scripts/generate-vendordomain-pages.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendordomain/pages
          if git diff --cached --quiet; then
            echo "No generated page changes."
          else
            git commit -m "build(vendordomain): generate 500 standalone feature pages"
            git push origin io
          fi
