name: BINTANG Global News Ingestion
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [io]
    paths:
      - "bintang/news/sources.json"
      - "scripts/ingest-bintang-news.py"
      - ".github/workflows/bintang-news-ingestion.yml"
permissions:
  contents: write
concurrency:
  group: bintang-news-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: io
      - name: Build news index
        run: python3 scripts/ingest-bintang-news.py
      - name: Publish index
        run: |
          if git diff --quiet -- bintang/news/news-index.json; then
            echo "News index unchanged."
            exit 0
          fi
          git config user.name "planetbintang-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bintang/news/news-index.json
          git commit -m "chore(bintang): refresh global news index"
          git push origin HEAD:io
