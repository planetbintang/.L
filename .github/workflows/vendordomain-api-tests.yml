name: VendorDomain API tests
on:
  push:
    branches: [io]
    paths:
      - 'vendordomain/backend/**'
      - 'vendordomain/blueprints/**'
      - 'vendordomain/reic/**'
      - '.github/workflows/vendordomain-api-tests.yml'
  pull_request:
    paths:
      - 'vendordomain/backend/**'
      - '.github/workflows/vendordomain-api-tests.yml'
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate 51 REIC blueprints and 2,601 binary formula rows
        run: node vendordomain/blueprints/verify-blueprints.mjs
      - name: Validate 36 manual REIC platform components
        run: node vendordomain/reic/verify-reic.mjs
      - name: Run API integration tests
        working-directory: vendordomain/backend
        run: npm test
