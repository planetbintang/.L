name: VendorDomain API tests
on:
  push:
    branches: [io]
    paths:
      - 'vendordomain/backend/**'
      - '.github/workflows/vendordomain-api-tests.yml'
  pull_request:
    paths:
      - 'vendordomain/backend/**'
      - '.github/workflows/vendordomain-api-tests.yml'
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run API integration tests
        working-directory: vendordomain/backend
        run: npm test
