name: Sync public repository dashboard

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-dashboard-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages source branch
        uses: actions/checkout@v4
        with:
          ref: io

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh repository metadata snapshot
        env:
          PLANETBINTANG_READ_TOKEN: ${{ secrets.PLANETBINTANG_READ_TOKEN }}
        run: python3 scripts/sync-dashboard.py

      - name: Commit updated snapshot to Pages source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json
          if git diff --cached --quiet; then
            echo "No dashboard snapshot changes."
            exit 0
          fi
          git commit -m "chore: refresh public repository dashboard snapshot"
          git push origin HEAD:io
