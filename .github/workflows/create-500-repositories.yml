          const owner = process.env.OWNER;
          const token = process.env.GH_TOKEN;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function request(url, options = {}) {
            for (let attempt = 0; attempt < 7; attempt++) {
              const response = await fetch(url, {
                ...options,
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(options.headers || {})
                }
              });
              if (response.ok) return response.status === 204 ? null : response.json();
              const body = await response.text();
              if (response.status === 404 && options.allow404) return null;
              if (![403, 429, 500, 502, 503, 504].includes(response.status)) {
                if (response.status === 422 && /already exists/i.test(body)) return { alreadyExists: true };
                throw new Error(`${response.status} ${url}: ${body}`);
              }
              const retry = Number(response.headers.get('retry-after') || 0);
              await sleep(Math.max(retry * 1000, Math.min(60000, 2000 * (attempt + 1))));
            }
            throw new Error(`Retry limit exceeded: ${url}`);
          }
          let created = 0, existing = 0, failed = 0;
          for (let i = 0; i < names.length; i++) {
            const name = names[i];
            try {
              const repo = await request(`https://api.github.com/repos/${owner}/${name}`, { method: 'GET', allow404: true });
              if (repo) { existing++; console.log(`EXISTS ${i+1}/${names.length} ${name}`); continue; }
              const result = await request('https://api.github.com/user/repos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  name,
                  description: `PlanetBintang REIC package: ${name}. Integratable application module for VMDESKTOPREIC.`,
                  private: false,
                  auto_init: true,
                  has_issues: true,
                  has_projects: false,
                  has_wiki: false
                })
              });
              if (result.alreadyExists) { existing++; continue; }
              // Rename the repository's configured initial branch to the required io branch.
              const initialBranch = result.default_branch || 'main';
              if (initialBranch !== 'io') await request(`https://api.github.com/repos/${owner}/${name}/branches/${encodeURIComponent(initialBranch)}/rename`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_name: 'io' })
              });
              await request(`https://api.github.com/repos/${owner}/${name}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ default_branch: 'io' })
              });
              const manifest = {
                name,
                version: '1.0.0',
                private: false,
                description: `PlanetBintang REIC package: ${name}`,
                type: 'module',
                main: 'src/index.js',
                exports: './src/index.js',
                scripts: { test: 'node --test', check: 'node --check src/index.js' },
                keywords: ['planetbintang', 'reic', 'vmdesktopreic', 'package'],
                planetbintang: { platform: 'VMDESKTOPREIC', packageType: 'reic-module', branch: 'io' }
              };
              const readme = `# ${name}\n\nPlanetBintang REIC package designed for integration with VMDESKTOPREIC.\n\n## Development\n\n- Branch: ` + '`io`' + `\n- Entry point: ` + '`src/index.js`' + `\n- Manifest: ` + '`package.json`' + `\n\nSee ` + '`docs/integration.md`' + ` for integration guidance.\n`;
              const files = [
                ['package.json', JSON.stringify(manifest, null, 2) + '\n'],
                ['src/index.js', `export const packageInfo = Object.freeze({ name: '${name}', platform: 'VMDESKTOPREIC', version: '1.0.0' });\n\nexport function initialize(context = {}) {\n  return { ...packageInfo, context, ready: true };\n}\n\nexport default initialize;\n`],
                ['src/styles.css', `:root { --reic-accent: #167da5; --reic-surface: #f4f8fa; }\n.reic-${name} { color: inherit; background: var(--reic-surface); }\n`],
                ['docs/integration.md', `# Integration\n\n1. Install or import this repository as a REIC package.\n2. Load ` + '`src/index.js`' + ` from the VMDESKTOPREIC package registry.\n3. Call ` + '`initialize(context)`' + ` with the host application context.\n4. Validate compatibility before production release.\n`]
              ];
              for (const [path, content] of files) {
                await request(`https://api.github.com/repos/${owner}/${name}/contents/${path}`, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    message: `Initialize REIC package: ${name}`,
                    branch: 'io',
                    content: Buffer.from(content).toString('base64')
                  })
                });
              }
              created++;
              console.log(`CREATED ${i+1}/${names.length} ${owner}/${name}`);
            } catch (error) {
              failed++;
              console.error(`FAILED ${i+1}/${names.length} ${name}: ${error.message}`);
            }
            await sleep(800);
          }
          console.log(JSON.stringify({ target: names.length, created, existing, failed }));
          if (failed) process.exitCode = 1;
          NODE
