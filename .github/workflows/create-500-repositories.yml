name: Create 500 PlanetBintang repositories

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE500 to create 500 public repositories
        required: true
        type: string

permissions:
  contents: read

jobs:
  create:
    if: ${{ inputs.confirmation == 'CREATE500' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Create repositories and initialize REIC packages
        env:
          GH_TOKEN: ${{ secrets.PLANETBINTANG_TOKEN }}
          OWNER: planetbintang
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add PLANETBINTANG_TOKEN in repository Actions secrets. It needs permission to create repositories."
            exit 1
          fi
