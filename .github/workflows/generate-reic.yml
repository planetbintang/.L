name: Bangun katalog komponen REIC
on:
  push:
    branches: [io]
    paths:
      - '.github/workflows/generate-reic.yml'
      - 'osmediavm/scripts/generate-reic.mjs'
      - 'osmediavm/recordin/component-detail.html'
      - 'osmediavm/recordin/component-detail.css'
      - 'osmediavm/recordin/component-detail.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generate-reic-catalog
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: io
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hasilkan 15.000 komponen REIC
        run: node osmediavm/scripts/generate-reic.mjs
      - name: Validasi katalog sebelum push
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'osmediavm/recordin/components';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.total !== 15000 || manifest.components.length !== 15000) {
            throw new Error(`Jumlah komponen tidak sesuai: total=${manifest.total}, daftar=${manifest.components.length}`);
          }
          let errors = [];
          for (const item of manifest.components) {
            for (const key of ['reic', 'css', 'js']) {
              const file = path.join(root, item[key]);
              if (!fs.existsSync(file)) errors.push(`Hilang: ${file}`);
              else if (fs.statSync(file).size === 0) errors.push(`Kosong: ${file}`);
            }
            const reicPath = path.join(root, item.reic);
            if (fs.existsSync(reicPath)) {
              const source = fs.readFileSync(reicPath, 'utf8');
              const lines = source.split(/\r?\n/).length;
              if (lines < 25) errors.push(`Kurang dari 25 baris: ${reicPath} (${lines})`);
              if (!source.includes('<section') || !source.includes('data-reic-output')) errors.push(`Markup/input-output tidak lengkap: ${reicPath}`);
              for (const marker of ['integration: reic-event-bus', 'integration_events:', 'lifecycle:', 'security:', 'api: CustomEvent(reic:action)', 'api: CustomEvent(reic:output)']) {
                if (!source.includes(marker)) errors.push(`Kontrak REIC hilang (${marker}): ${reicPath}`);
              }
            }
          }
          if (errors.length) {
            console.error(errors.slice(0, 50).join('\\n'));
            throw new Error(`Validasi gagal: ${errors.length} masalah`);
          }
          console.log(`Validasi berhasil: ${manifest.total} komponen, ${manifest.total * 3} berkas kode.`);
          NODE
      - name: Commit 45.000 berkas komponen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osmediavm/recordin/components
          if git diff --cached --quiet; then echo "Katalog sudah mutakhir"; exit 0; fi
          git commit -m "Bangun katalog 15.000 komponen REIC"
          git push origin HEAD:io
