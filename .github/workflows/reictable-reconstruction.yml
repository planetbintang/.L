name: PlanetBintang REICTABLE Reconstruction
on:
  workflow_dispatch:
  push:
    branches: [io, reictable-data-backend]
    paths: ['reictable/manifest.json', 'reictable/engine/**', 'file-manager.js', '.github/workflows/reictable-reconstruction.yml']
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
concurrency:
  group: reictable-reconstruction
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.ref_name }}, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node reictable/engine/build-registry.mjs
      - run: node reictable/engine/test.mjs
      - run: node reictable/engine/reconstruct.mjs
      - name: Commit generated data snapshots
        run: |
          git config user.name "planetbintang-automation[bot]"
          git config user.email "planetbintang-automation[bot]@users.noreply.github.com"
          git add reictable/modules reictable/registry.json reictable/file-manager-index.json data/reictable-reconstruction.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "build(reictable): refresh registry and reconstruction [skip ci]"; git push origin HEAD:${{ github.ref_name }}; fi
