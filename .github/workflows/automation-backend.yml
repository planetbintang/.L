name: PlanetBintang Automation Backend

on:
  workflow_dispatch:
    inputs:
      feature_id:
        description: "ID fitur katalog, misalnya F-CICD-0251 (kosongkan untuk tugas umum)"
        required: false
        type: string
      change_summary:
        description: "Instruksi implementasi atau ringkasan perubahan"
        required: true
        type: string
      files_json:
        description: 'Array JSON file baru: [{"path":"docs/example.md","content":"..."}]'
        required: false
        type: string
        default: "[]"

permissions:
  contents: write

concurrency:
  group: planetbintang-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: io
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare task, create new files, and record changes
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/run-system-automation.mjs

      - name: Validate JSON records
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('automation/requests').filter(name => name.endsWith('.json'));
          if (!files.length) throw new Error('Tidak ada request record yang dibuat.');
          for (const name of files) JSON.parse(fs.readFileSync('automation/requests/' + name, 'utf8'));
          const lines = fs.readFileSync('automation/records/changes.jsonl', 'utf8').trim().split(/\r?\n/);
          for (const line of lines) JSON.parse(line);
          console.log('Validasi request dan change log berhasil.');
          NODE

      - name: Commit generated files and audit record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/requests automation/records
          git add --all
          if git diff --cached --quiet; then echo "Tidak ada perubahan untuk disimpan."; exit 0; fi
          git commit -m "automation: prepare task and record generated files"
          git push origin HEAD:io
