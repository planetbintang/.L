name: Generate REIC code — 4 tasks × 500,000 files

on:
  workflow_dispatch:
    inputs:
      shard_size:
        description: "Files per execution batch (100–10000)"
        required: true
        default: "10000"
  schedule:
    - cron: "40 2 * * 0"

permissions:
  contents: read

concurrency:
  group: reic-four-task-generation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      shard_size: ${{ steps.matrix.outputs.shard_size }}
    steps:
      - id: matrix
        shell: bash
        env:
          INPUT_SIZE: ${{ github.event.inputs.shard_size || '10000' }}
        run: |
          set -euo pipefail
          size="$INPUT_SIZE"
          if ! [[ "$size" =~ ^[0-9]+$ ]] || (( size < 100 || size > 10000 )); then
            echo "shard_size must be between 100 and 10000" >&2
            exit 1
          fi
          shards=$(( (500000 + size - 1) / size ))
          matrix='{"include":['
          comma=''
          for task in 0 1 2 3; do
            for shard in $(seq 0 $((shards - 1))); do
              matrix+="$comma{\"task\":$task,\"shard\":$shard}"
              comma=','
            done
          done
          matrix+=']}'
          echo "value=$matrix" >> "$GITHUB_OUTPUT"
          echo "shard_size=$size" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout source catalog and generator
        uses: actions/checkout@v4
        with:
          ref: io
          sparse-checkout: |
            data/git-feature-catalog.json
            scripts/generate-reic-mass.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and verify task shard
        env:
          REIC_TASK_INDEX: ${{ matrix.task }}
          REIC_SHARD_INDEX: ${{ matrix.shard }}
          REIC_SHARD_SIZE: ${{ needs.plan.outputs.shard_size }}
          REIC_OUTPUT_DIR: dist/reic-mass
        run: |
          node scripts/generate-reic-mass.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('dist/reic-mass/manifest.json', 'utf8'));
          if (m.taskCount !== 4 || m.taskTargetFiles !== 500000) throw new Error('Task target mismatch');
          if (m.verifiedFiles !== m.shardSize) throw new Error('File count mismatch');
          for (const f of m.files) {
            const p = 'dist/reic-mass/' + f.path;
            if (!fs.existsSync(p)) throw new Error('Missing ' + p);
            const n = fs.readFileSync(p, 'utf8').trimEnd().split(/\r?\n/).length;
            if (n < 100) throw new Error(p + ' has only ' + n + ' lines');
          }
          console.log('Verified task ' + (m.taskNumber) + '/4, shard ' + m.shardIndex + ': ' + m.verifiedFiles + ' files, each 100+ lines.');
          NODE

      - name: Package verified shard
        uses: actions/upload-artifact@v4
        with:
          name: reic-task-${{ matrix.task }}-shard-${{ matrix.shard }}
          path: dist/reic-mass/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
