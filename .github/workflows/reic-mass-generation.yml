name: Build REIC code in one day — 4 tasks × 500,000

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: reic-one-day-four-tasks
  cancel-in-progress: false

jobs:
  generate:
    name: TASK ${{ matrix.task_number }} — 500,000 REIC files
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - task_index: 0
            task_number: 1
          - task_index: 1
            task_number: 2
          - task_index: 2
            task_number: 3
          - task_index: 3
            task_number: 4

    steps:
      - name: Checkout source catalog and generator
        uses: actions/checkout@v4
        with:
          ref: io
          sparse-checkout: |
            data/git-feature-catalog.json
            scripts/generate-reic-mass.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate 500,000 files for this task
        env:
          REIC_TASK_INDEX: ${{ matrix.task_index }}
          REIC_SHARD_INDEX: "0"
          REIC_SHARD_SIZE: "500000"
          REIC_OUTPUT_DIR: dist/reic-mass
        run: node scripts/generate-reic-mass.mjs

      - name: Verify every file and task manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'dist/reic-mass';
          const m = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (m.taskCount !== 4 || m.taskTargetFiles !== 500000) throw new Error('Task configuration mismatch');
          if (m.verifiedFiles !== 500000 || m.shardSize !== 500000) throw new Error('Expected exactly 500,000 files');
          const seen = new Set();
          for (const f of m.files) {
            if (seen.has(f.path)) throw new Error('Duplicate path: ' + f.path);
            seen.add(f.path);
            const p = path.join(root, f.path);
            if (!fs.existsSync(p)) throw new Error('Missing file: ' + p);
            const lines = fs.readFileSync(p, 'utf8').trimEnd().split(/\\r?\\n/).length;
            if (lines < 100) throw new Error(p + ' has only ' + lines + ' lines');
          }
          console.log('PASS: TASK ' + m.taskNumber + ' verified ' + seen.size + ' files; each has at least 100 lines.');
          NODE

      - name: Package task output
        run: |
          mkdir -p dist/packages
          tar -czf "dist/packages/reic-task-${{ matrix.task_number }}.tar.gz" -C dist/reic-mass .

      - name: Upload completed task package
        uses: actions/upload-artifact@v4
        with:
          name: reic-task-${{ matrix.task_number }}-500000-files
          path: dist/packages/reic-task-${{ matrix.task_number }}.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
