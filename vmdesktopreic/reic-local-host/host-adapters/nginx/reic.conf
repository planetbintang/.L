# REIC Local Host — Nginx reverse proxy
# Simpan sebagai konfigurasi server/site yang sesuai. Aktifkan TLS melalui sertifikat CA yang sah.
server {
    listen 80;
    server_name reic.localhost;
    client_max_body_size 10m;

    location /api/reic/ {
        proxy_pass http://127.0.0.1:8787/api/reic/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
    }

    # Jangan menayangkan direktori data, backup, atau berkas rahasia.
    location ~* ^/(data|backups|\.env)(/|$) { deny all; }
}
