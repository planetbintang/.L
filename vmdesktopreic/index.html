<style id="vmdesktop-page-position">
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#050505}
#desktop-root{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;min-height:0!important;display:block!important;overflow:hidden!important;padding:0!important;background:#050505}
#desktop-root:before,#desktop-root:after{content:"";position:absolute;left:5px;right:5px;height:6px;background:#050505;z-index:20;pointer-events:none}
#desktop-root:before{top:31.25%}
#desktop-root:after{top:65.25%}
#desktop-root>.vm-web-region{position:absolute!important;left:5px!important;right:5px!important;top:5px!important;height:calc(31.25% - 8px)!important;display:block!important;background:#fff!important;pointer-events:none!important}
#desktop-root>.vm-empty-region{position:absolute!important;left:5px!important;right:5px!important;bottom:5px!important;height:calc(34.75% - 8px)!important;display:block!important;background:#fff!important;pointer-events:none!important}
#desktop-root>.vm-shell{position:absolute!important;left:50%!important;top:48.25%!important;right:auto!important;bottom:auto!important;width:1920px!important;height:1080px!important;min-width:1920px!important;min-height:1080px!important;max-width:none!important;max-height:none!important;margin:0!important;transform:translate(-50%,-50%) scale(var(--vm-scale,1))!important;transform-origin:50% 50%!important}
@media(prefers-reduced-motion:reduce){#desktop-root>.vm-shell:before,#desktop-root>.vm-shell:after{animation:none!important}}
</style>

#vmDesktop .vm-clock,#vmDesktop .vm-search,#vmDesktop .vm-header-tools button,
#vmDesktop .core-item,#vmDesktop .core-item>span,

}

 border:0!important;padding:10px 18px!important}
#vmDesktop .modal-body{flex:1 1 auto!important;min-height:0!important;max-height:none!important;
 overflow:auto!important;overscroll-behavior:contain!important;padding:18px 22px!important}
#vmDesktop .vm-modal>footer{height:58px!important;min-height:58px!important;flex:0 0 58px!important;border:0!important}

#vmDesktop .system-card,#vmDesktop .content-card,#vmDesktop .settings-group,
#vmDesktop .info-row,#vmDesktop .setting-row,#vmDesktop .menu-choice,
#vmDesktop .menu-choice-intro,#vmDesktop .pb-detail-tools,#vmDesktop .pb-detail-canvas,

<body><main id="desktop-root"><div id="boot">VMDESKTOPREIC · Memuat ruang desktop REIC…</div></main>
<script>
(()=> {
 const root=document.getElementById('desktop-root');
 let resizeQueued=false;
 const fit=()=>{
  resizeQueued=false;
  const w=document.documentElement.clientWidth||innerWidth;
  const h=document.documentElement.clientHeight||innerHeight;
  const scale=Math.min((w-10)/1920,((h*.34)-12)/1080);
  root.style.setProperty('--vm-scale',String(Math.max(.05,scale)));
 };
 const scheduleFit=()=>{if(resizeQueued)return;resizeQueued=true;requestAnimationFrame(fit);};
 fit();addEventListener('resize',scheduleFit,{passive:true});addEventListener('orientationchange',scheduleFit,{passive:true});
 const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error(src+' gagal dimuat'));document.body.append(s);});
 (async()=>{
  try{
   const response=await fetch('./desktop.reic',{cache:'force-cache'});
   if(!response.ok)throw Error('desktop.reic · HTTP '+response.status);
   root.innerHTML=await response.text();
   await loadScript('./desktop.js');
   /* Muat modul inti yang independen secara paralel agar splash screen lebih singkat. */
   await Promise.all([
    loadScript('./desktop-runtime.js'),
    loadScript('./menu-system/main-menu.reicjs?v=20261104-menu-modal-v2'),
    loadScript('./menu-system/catalog.reicjs?v=20261104-150-catalog')
   ]);
   /* Launcher dan routing juga tidak saling menunggu. */
   await Promise.all([
    loadScript('./desktop-experience.js?v=20261104-launcher-keyboard-1'),
    loadScript('./desktop-unified.js?v=20261104-unified-1'),
    loadScript('./search-center.js?v=20261104-github-provider-3'),
    loadScript('./integration/boot.js?v=20261104-component-integration-1')
   ]);
   fit();
   root.classList.add('vm-ready');
   /* Filemanajer bukan dependensi boot; muat setelah desktop tampil atau saat browser idle. */
   const loadFilemanajer=()=>loadScript('./filemanager-app.js?v=20261104-modal-transparent-6').catch(error=>console.warn('Filemanajer ditunda:',error));
   if('requestIdleCallback' in window)requestIdleCallback(loadFilemanajer,{timeout:1800});
   else setTimeout(loadFilemanajer,900);
   let layersLoading=false;
   document.addEventListener('click',e=>{
    if(layersLoading||!e.target.closest('.core-item,[data-open],#modalTabs'))return;
    layersLoading=true;
    loadScript('./layers.js').catch(error=>console.warn('Editor lapisan dimuat saat diperlukan:',error));
   },{capture:true});
  }catch(error){
   root.innerHTML='<pre style="padding:24px;color:#ffb6b6;white-space:pre-wrap">VMDESKTOPREIC gagal dimuat: '+String(error).replace(/[<>&]/g,'')+'</pre>';
  }
 })();
})();
</script></body></html>
