<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="description" content="VMDESKTOPREIC OS MEDIA VM dengan aplikasi File Manajer REIC."><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>VMDESKTOPREIC — OS MEDIA VM</title>
<link rel="stylesheet" href="./desktop.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#eaf4ff;font:14px system-ui,sans-serif}#desktop-root{position:relative;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}#boot{padding:24px;color:#9fc8e8}</style>
</head><body><main id="desktop-root"><div id="boot">VMDESKTOPREIC · Memuat runtime OS MEDIA VM…</div></main>
<script>
(async()=>{const root=document.getElementById('desktop-root');const fit=()=>{const rect=root.getBoundingClientRect();const width=Math.max(1,document.documentElement.clientWidth||window.innerWidth);const height=Math.max(1,document.documentElement.clientHeight||window.innerHeight);const scale=Math.min((width-32)/1920,(height-32)/1080);root.style.setProperty('--vm-scale',String(Math.max(.1,scale)));};fit();addEventListener('resize',fit,{passive:true});addEventListener('orientationchange',fit,{passive:true});try{const r=await fetch('./desktop.reic',{cache:'no-cache'});if(!r.ok)throw Error('desktop.reic · HTTP '+r.status);root.innerHTML=await r.text();const s=document.createElement('script');s.src='./desktop.js';s.defer=true;s.onload=()=>{const workspace=document.createElement('script');workspace.src='./workspace.js';workspace.defer=true;workspace.onload=()=>{const layer=document.createElement('script');layer.src='./layers.js';layer.defer=true;document.body.append(layer);};workspace.onerror=()=>{root.insertAdjacentHTML('beforeend','<pre style="padding:12px;color:#ffb6b6">Workspace REIC gagal dimuat.</pre>');};document.body.append(workspace);};s.onerror=()=>{root.innerHTML='<pre style="padding:24px;color:#ffb6b6">Runtime JavaScript gagal dimuat.</pre>';};document.body.append(s);}catch(e){root.innerHTML='<pre style="padding:24px;color:#ffb6b6">Runtime gagal dimuat: '+String(e).replace(/[<>&]/g,'')+'</pre>';}})();
</script></body></html>
