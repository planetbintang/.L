<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="description" content="VMDESKTOPREIC OS MEDIA VM — desktop REIC full-screen responsive workspace.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>VMDESKTOPREIC — OS MEDIA VM</title>
<link rel="preload" href="./desktop.reic" as="fetch" crossorigin>
<link rel="preload" href="./desktop.js" as="script">
<link rel="stylesheet" href="./desktop.css?v=20261103-gallery-7d-modal-v1">
<link rel="stylesheet" href="./menu-system/main-menu.reicss?v=20261104-menu-modal-v1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#eaf4ff;font:14px system-ui,sans-serif}
#desktop-root{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden}
#boot{padding:24px;color:#9fc8e8}
</style><style id="reic-viewport-fit">
html,body,#desktop-root{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden}
#desktop-root{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;padding:0;display:block;overflow:hidden}
#desktop-root>.vm-shell{width:100%;height:100%;min-width:0;min-height:0;max-width:none;max-height:none;transform:none}
</style>
<link rel="stylesheet" href="./menu-system/catalog.reicss?v=20261104-150-catalog">
</head>
<body><main id="desktop-root"><div id="boot">VMDESKTOPREIC · Memuat desktop REIC full-screen…</div></main>
<script>
(()=> {
 const root=document.getElementById('desktop-root');
 let resizeQueued=false;
 const fit=()=>{
  resizeQueued=false;
  const w=document.documentElement.clientWidth||innerWidth;
  const h=document.documentElement.clientHeight||innerHeight;
  const scale=Math.min(w/1920,h/1080);
  root.style.setProperty('--vm-scale',String(Math.max(.05,scale)));
 };
 const scheduleFit=()=>{if(resizeQueued)return;resizeQueued=true;requestAnimationFrame(fit);};
 fit();addEventListener('resize',scheduleFit,{passive:true});addEventListener('orientationchange',scheduleFit,{passive:true});
 const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error(src+' gagal dimuat'));document.body.append(s);});
 (async()=>{
  try{
   const response=await fetch('./desktop.reic',{cache:'force-cache'});
   if(!response.ok)throw Error('desktop.reic · HTTP '+response.status);
   root.innerHTML=await response.text();
   await loadScript('./desktop.js');
   await loadScript('./desktop-runtime.js');
   await loadScript('./menu-system/main-menu.reicjs?v=20261104-menu-modal-v1');
   await loadScript('./menu-system/catalog.reicjs?v=20261104-150-catalog');
   fit();
   root.classList.add('vm-ready');
   let layersLoading=false;
   document.addEventListener('click',e=>{
    if(layersLoading||!e.target.closest('.core-item,[data-open],#modalTabs'))return;
    layersLoading=true;
    loadScript('./layers.js').catch(error=>console.warn('Editor lapisan dimuat saat diperlukan:',error));
   },{capture:true});
  }catch(error){
   root.innerHTML='<pre style="padding:24px;color:#ffb6b6;white-space:pre-wrap">VMDESKTOPREIC gagal dimuat: '+String(error).replace(/[<>&]/g,'')+'</pre>';
  }
 })();
})();
</script></body></html>
