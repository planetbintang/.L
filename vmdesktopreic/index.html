<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>VMDESKTOPREIC — OS MEDIA VM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#eaf4ff;font:14px system-ui,sans-serif}#desktop-root{position:relative;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}#boot{padding:24px;color:#9fc8e8}</style></head>
<body><main id="desktop-root"><div id="boot">VMDESKTOPREIC · Memuat runtime OS MEDIA VM…</div></main>
<script>
(async()=>{const root=document.getElementById('desktop-root');try{const [markup,css,js]=await Promise.all(['./desktop.reic','./desktop.reiccss','./desktop.reicjs'].map(async p=>{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw Error(p+' · HTTP '+r.status);return r.text()}));root.innerHTML=markup;const style=document.createElement('style');style.textContent=css;document.head.append(style);const script=document.createElement('script');script.textContent=js;document.body.append(script);}catch(e){root.innerHTML='<pre style="padding:24px;color:#ffb6b6">Runtime gagal dimuat: '+String(e).replace(/[<>&]/g,'')+'</pre>';}}
)();
</script></body></html>
